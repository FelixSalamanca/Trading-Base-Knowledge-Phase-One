caveats:
- Both arms come from the same signal engine under one configuration. This compares what happens after
  each event type, not what would happen if the system required a retest before signalling -- that is
  h-retest-beats-immediate-breakout and needs a configuration change.
- Event labels are assigned by the indicator's own S/R registry, so the comparison inherits whatever that
  registry counts as a retest.
- Signals carrying neither label are excluded from both arms.
