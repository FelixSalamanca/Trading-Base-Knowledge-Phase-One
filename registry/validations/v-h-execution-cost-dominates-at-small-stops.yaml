caveats:
- 'The floor is arithmetic, not statistical: once cost_r exceeds the reward multiple, break-even needs
  a win rate above 100%.'
- Cost is modelled from the REALISTIC scenario, not measured from a live account -- the demo feed records
  zero spread on every bar.
- Trades are split at the median cost_r, so the two halves also differ in symbol mix; the gross comparison
  is what guards against reading that mix as an effect.
- Gross performance is statistically flat across the cost range (p=0.376), so the net difference is attributable
  to cost rather than to small-stop trades being worse setups.
