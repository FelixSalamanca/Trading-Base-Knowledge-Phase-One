caveats:
- Trades from eight symbols are pooled in signal-time order, so an apparent run may be several instruments
  moving together rather than one instrument persisting.
- A null result supports independence, which is what the Monte Carlo in the research layer already assumes
  when it resamples the R sequence.
- Fewer runs than expected means clustering; more means alternation. Only the first would justify reducing
  size after a losing run.
- 1 of 8 symbols show clustering on their own sequence. If that count is low while the pooled test is
  significant, the pooled effect is correlation between instruments rather than persistence within one
  -- and size reduction after a losing run would then be the wrong response to it.
