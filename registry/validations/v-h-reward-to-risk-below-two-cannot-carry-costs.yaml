caveats:
- The three published targets carry observed hit rates. Everything in the extrapolated grid assumes accuracy
  continues to decay the same way, which is an assumption, not a measurement.
- The TP2 and TP3 rates are LOWER BOUNDS, not the win rate a hold-to-that-target policy would produce.
  Tracking stops at the first target touched, so a trade that reached TP1 and was never followed further
  counts here as not reaching TP2 -- when it might have. The TP1 row carries no such distortion, since
  it uses the realised win rate, and it is the row the verdict rests on.
- Widening the target while holding the stop fixed is not the only way to raise the ratio -- tightening
  the stop raises it too, and would change the hit rate in the opposite direction.
- Cost is modelled from the REALISTIC scenario. The demo feed records zero spread, so no measured broker
  cost exists yet.
- This says which configurations are within reach of the current accuracy. It does not say the system
  becomes profitable at any of them.
