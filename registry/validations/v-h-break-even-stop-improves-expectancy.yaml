caveats:
- UPPER BOUND ONLY. Losers rescued are counted exactly; winners lost to the same stop cannot be counted,
  because the journal records a single mae_r figure rather than the price path.
- 303 of 318 winners went negative at some point, so the unmeasured population is large, not a rounding
  error.
- 'Mean winner MAE is a further warning: winners routinely travel a long way against the position before
  working, which is exactly the condition under which a break-even stop does damage.'
- Settling this needs InpBreakEvenAtR set to a candidate value and a fresh collection period. The feature
  already exists in the indicator; only the value is disabled.
