# HYPOTHESIS REGISTRY
#
# A concept becomes an entry here only once someone can state what measurement
# would settle it AND what result would refute it. Both fields are enforced by
# the schema; an entry that cannot supply them must be filed `unfalsifiable`,
# which is a legitimate and useful outcome rather than a failure.
#
# `sample_required` is the number of trades needed to detect the claimed effect
# at 80% power, alpha 0.05, from a 52.4% baseline. Recorded so the queue can be
# ordered by what is answerable rather than by what sounds exciting.
#
# Nothing here is believed. Status starts at `untested` and only a validation
# file -- carrying n, p-value, effect size and a dataset hash -- can move it.
# An inconclusive test leaves status at `untested` and records `last_attempt`,
# because a test that could not separate the possibilities has not answered
# the question.
#
# This file is rewritten by `python -m kb test`. Edit it by hand freely, but
# expect formatting to be normalised on the next run.

- id: h-retest-beats-immediate-breakout
  category: breakouts
  statement: 'Requiring a confirmed retest of a broken level before crediting a breakout improves expectancy
    compared with crediting the break immediately.

    '
  derived_from:
  - ho-5-minute-standard-deviation-scalp
  - ho-15-minute-opening-range-scalp
  measurable_as: 'Run the journal with InpBreakoutRetestMode = false (current) and = true, holding every
    other input fixed, and compare expectancy on signals whose sr_event is a breakout. The two source
    concepts disagree with each other, so this test adjudicates between them on our own data rather than
    choosing an author to believe.

    '
  metrics:
  - win_rate
  - expectancy
  - average_r
  - profit_factor
  - max_drawdown_r
  - sample_size
  breakdowns:
  - regime
  - symbol
  - timeframe
  - session
  invalidated_by: 'Retest-confirmed breakouts showing expectancy equal to or below immediate entries,
    or the retest requirement cutting sample so far that no difference is detectable.

    '
  testability: needs_new_data
  sample_required: 3106
  status: untested
  felix_inputs:
  - InpBreakoutRetestMode
  - InpRetestLookback
  notes: 'Cannot be answered from the existing journal: every recorded row was generated with the retest
    requirement off, so there is no retest arm to compare against. Needs a configuration change and a
    fresh collection period, which is why it sits behind the cheaper tests below.

    '
- id: h-engulfing-performs-differently-by-session
  category: candlestick_patterns
  statement: 'Engulfing patterns produce better expectancy during high-participation sessions than during
    quiet ones.

    '
  derived_from:
  - ho-engulfment-penny-pincher
  measurable_as: 'Group existing journal rows where pattern is a bullish or bearish engulfing by session,
    and compare win rate and expectancy across London, New York and the London/New York overlap. Uses
    research.analysis.buckets.by_session on a pattern-filtered frame.

    '
  invalidated_by: 'No difference in expectancy across sessions once the multiple-testing correction is
    applied.

    '
  testability: existing_data_full
  sample_required: 767
  status: untested
  felix_inputs:
  - InpWeightCandle
  - InpSessionFilter
  notes: 'Answerable today with no change to the indicator -- both `pattern` and `session` are already
    recorded for all 525 rows. The existing factor screen found `pattern` non-significant when pooled
    across sessions (Cramer''s V 0.075, p_raw 0.882); this hypothesis proposes that the pooling is what
    hid the effect. If the interaction is also null, that is a real answer and closes the question.

    '
  last_attempt:
    date: '2026-08-21'
    validation_id: v-h-engulfing-performs-differently-by-session
    reason: inconclusive -- sample below the required size
- id: h-hour-of-day-carries-an-edge
  category: strategy_concepts
  statement: 'Specific hours of the trading day carry a reversal or continuation tendency beyond what
    the broad session filter already captures.

    '
  derived_from:
  - ho-10-oclock-jiggle
  - ho-3-oclock-jiggle
  measurable_as: 'Group existing journal rows by hour of signal_time and compare expectancy across hours,
    with Benjamini-Hochberg correction over the 24 comparisons.

    '
  invalidated_by: 'No hour surviving FDR correction, which is the expected outcome given that testing
    24 hours guarantees roughly one raw-significant result by chance.

    '
  testability: existing_data_full
  sample_required: 767
  status: untested
  felix_inputs:
  - InpSessionFilter
  notes: 'The author''s evidence is one week of S&P futures in 2003. A fixed clock hour is among the most
    overfit-prone claims in trading literature, so the FDR correction is not optional here. Cheap to run
    and worth closing.

    '
  last_attempt:
    date: '2026-08-21'
    validation_id: v-h-hour-of-day-carries-an-edge
    reason: inconclusive -- sample below the required size
- id: h-execution-cost-dominates-at-small-stops
  category: risk_management
  statement: 'Below some stop distance, realistic execution cost consumes enough of the risk that no achievable
    win rate makes the trade positive.

    '
  derived_from:
  - ho-scalping-definition
  measurable_as: 'For each symbol, compute cost_r from research.analysis.costs.apply_scenario under the
    REALISTIC scenario and regress net expectancy on mean stop distance in points.

    '
  invalidated_by: 'Net expectancy showing no relationship with stop distance.

    '
  testability: existing_data_full
  sample_required: 100
  status: supported
  felix_inputs:
  - InpStopLossATR
  notes: 'The author assumes execution cost is negligible against his profit objective. Our data suggests
    the opposite holds for M5 forex, but that has not been stated as a formal hypothesis and tested until
    now. Already strongly indicated by the per-symbol cost table (AUDUSD 0.891 R cost on a 2.7-pip stop
    versus XAUUSD 0.059 R on a 712-point stop); this entry turns that observation into a recorded, refutable
    claim.

    '
  validation_id: v-h-execution-cost-dominates-at-small-stops
- id: h-oscillator-slope-filter-improves-momentum
  category: momentum
  statement: 'Filtering a momentum signal by the slope of the oscillator''s own moving average improves
    expectancy over taking the crossover unfiltered.

    '
  derived_from:
  - raschke-the-anti
  measurable_as: 'Add a slope condition to the existing RSI and MACD momentum component and compare expectancy
    against the current unfiltered scoring, holding all other weights fixed.

    '
  invalidated_by: 'No improvement in expectancy, or an improvement that disappears out-of-sample in walk-forward
    windows.

    '
  testability: needs_new_data
  sample_required: 3106
  status: untested
  felix_inputs:
  - InpWeightMomentum
  - InpRsiPeriod
  notes: 'Deliberately framed as a filter on the momentum indicators FelixScalper already computes, not
    as "add a stochastic". Adding an indicator would change several things at once and make the result
    uninterpretable.

    '
- id: h-trading-metaphor-shapes-perception
  category: psychology
  statement: 'The metaphor a trader uses to describe trading shapes their perception and ultimately their
    results.

    '
  derived_from:
  - ho-scalping-definition
  testability: not_measurable
  status: unfalsifiable
  notes: 'Kevin Ho opens the article with this, citing Tony Robbins. Nothing in a trade journal could
    confirm or refute it. Recorded so the claim is not silently dropped, and filed where it cannot be
    mistaken for evidence.

    '
- id: h-twenty-trades-is-enough-to-judge-an-edge
  category: strategy_concepts
  statement: A sample of 20 trades is large enough to tell a working edge from a failing one, as Douglas
    recommends.
  derived_from:
  - douglas-judge-an-edge-over-a-sample-of-twenty
  measurable_as: Split the journal into consecutive non-overlapping 20-trade windows and measure the spread
    of win rates across them. If windows drawn from one unchanged system disagree with each other by more
    than the effect a trader would act on, then 20 trades cannot support the judgement Douglas asks it
    to support. Compare against the same measurement at 100 and 250.
  invalidated_by: Twenty-trade windows clustering tightly around the overall win rate, so that any single
    window would lead to the same conclusion as the full sample.
  testability: existing_data_full
  sample_required: 400
  status: rejected
  felix_inputs: []
  notes: The one claim in Trading in the Zone that our own data can adjudicate. Douglas offers 20 from
    experience with no calculation shown; our power analysis puts the requirement at 767 trades for a
    10-point effect. This test does not need a power calculation to answer it -- it simply shows what
    conclusions 20-trade windows actually produce when the system behind them has not changed at all.
  validation_id: v-h-twenty-trades-is-enough-to-judge-an-edge
- id: h-mindset-not-analysis-drives-consistency
  category: psychology
  statement: Consistent results come from the trader's mental state rather than from better analysis or
    more mechanical setups.
  derived_from:
  - douglas-consistency-is-a-mental-state-not-analysis
  - ho-scalping-definition
  testability: not_measurable
  status: unfalsifiable
  notes: 'Registered to record a real disagreement between two sources: Douglas argues that more analysis
    is not the answer, while Kevin Ho''s entire contribution is mechanical setups with fixed rules. Both
    may be right for different traders. Our journal contains no measurement of a mental state, so nothing
    in it could separate the two positions -- and saying so is more useful than staging a test that could
    not decide anything.'
- id: h-break-even-stop-improves-expectancy
  category: trade_management
  statement: Moving the stop to entry once a trade reaches a threshold of open profit improves expectancy
    over letting every loser run to the full stop.
  derived_from:
  - zalesky-never-turn-a-winner-into-a-loser
  measurable_as: 'Set InpBreakEvenAtR from 0.0 (disabled) to a candidate threshold and compare expectancy
    against the current arm. Partial evidence is available immediately from recorded excursions: for every
    losing trade, mfe_r says whether it ever reached the threshold, so the trades a break-even stop would
    have rescued can be counted exactly.'
  invalidated_by: The number of winners that would have been stopped at break-even before reaching target
    outweighing the losers rescued.
  testability: existing_data_censored
  sample_required: 767
  status: untested
  felix_inputs:
  - InpBreakEvenAtR
  notes: 'Censored in one direction, and the direction matters. Losers rescued can be counted exactly,
    because a loser with mfe_r above the threshold definitely reached it. Winners lost cannot: the journal
    records a single mae_r figure, not the path, so a winner that dipped back through break-even after
    reaching the threshold and then recovered to target is invisible. Any estimate from existing data
    is therefore an upper bound on the benefit, and must be reported as one. The feature already exists
    in the indicator, so the confirming test needs a value change and a collection period, not new code.'
  last_attempt:
    date: '2026-08-21'
    validation_id: v-h-break-even-stop-improves-expectancy
    reason: inconclusive -- sample below the required size
- id: h-losing-runs-cluster
  category: risk_management
  statement: Losing trades cluster rather than being independently distributed, which is what would justify
    reducing size during a losing run.
  derived_from:
  - zalesky-reduce-size-when-trading-poorly
  measurable_as: 'Test the chronological sequence of trade outcomes for autocorrelation: a runs test on
    the win/loss sequence and lag-1 autocorrelation on realised_r, per symbol and pooled.'
  invalidated_by: The outcome sequence being indistinguishable from independent draws, in which case a
    losing run carries no information about the next trade and reducing size after one lowers expectancy
    without a proportional reduction in risk.
  testability: existing_data_full
  sample_required: 400
  status: supported
  felix_inputs: []
  notes: Adjudicates a genuine disagreement between two sources. Zalesky says reduce size when trading
    poorly, which only pays if losses cluster. Mark Douglas's third fundamental truth says there is a
    random distribution between wins and losses for any given edge, which says they do not. Our Monte
    Carlo already assumes independence when it resamples the R sequence, so this test also checks an assumption
    the research layer is relying on.
  validation_id: v-h-losing-runs-cluster
- id: h-scaling-out-beats-taking-the-single
  category: trade_management
  statement: Taking partial profit and leaving a runner produces higher expectancy than closing the whole
    position at the first target.
  derived_from:
  - zalesky-scale-out-of-winners
  - zalesky-never-take-a-big-loss
  measurable_as: Model a split exit -- half the position at TP1, half at TP2 -- against closing everything
    at TP1, using the recorded tp1_hit/tp2_hit flags and rr1/rr2 multiples. Compare expectancy, profit
    factor and max drawdown across both models via research.analysis.exits.
  invalidated_by: The runner half contributing less than it costs, so that a full exit at TP1 matches
    or beats the split.
  testability: existing_data_censored
  sample_required: 767
  status: untested
  felix_inputs:
  - InpTakeProfit1ATR
  - InpTakeProfit2ATR
  - InpTakeProfit3ATR
  notes: 'Adjudicates Zalesky against himself: Rules 16-18 say hit singles and never risk a big loss,
    Rule 20 says scale out and let part run. Both are his, so this is not a question of which author to
    believe.


    Censored, and severely. The indicator stops tracking the instant any target is touched, so a trade
    recorded as TP1_ONLY says only that price reached TP1 -- whether the runner would have gone on to
    TP2 or turned and hit the stop is simply absent from the data. Existing figures bound the question
    rather than answer it: price reaches TP2 on about 15% of trades and TP3 on about 4%, and the all-or-nothing
    exit models already measured are far worse than the current policy (TP2 always: -0.622R, TP3 always:
    -0.874R against ACTUAL +0.037R). Settling it properly needs the indicator to keep tracking past the
    first target.'
- id: h-reward-to-risk-below-two-cannot-carry-costs
  category: risk_management
  statement: A reward-to-risk ratio below 2:1 cannot sustain positive expectancy once realistic execution
    costs are charged, because the hit rate required exceeds what the system achieves.
  derived_from:
  - landry-reward-to-risk-minimum-two-to-one
  measurable_as: Compute the break-even hit rate w = (1 + cost_r) / (1 + rr) across candidate reward multiples
    from the current 0.807 up to 3.0, using measured cost_r per symbol, and compare each against the hit
    rate actually achieved. The reward multiple is a configuration choice, so this asks which choices
    are reachable at our measured accuracy rather than predicting a market outcome.
  invalidated_by: The hit rate rising as the target widens, enough to keep the required rate reachable
    at ratios below 2:1. Landry assumes it does not; that assumption is what is being tested.
  testability: existing_data_censored
  sample_required: 400
  status: supported
  felix_inputs:
  - InpStopLossATR
  - InpTakeProfit1ATR
  - InpTakeProfit2ATR
  - InpTakeProfit3ATR
  notes: 'The most directly relevant hypothesis in the registry to what is currently blocking the project,
    and the only one derived from a source that names a number our configuration violates: Landry says
    2:1 minimum, FelixScalper runs 0.83:1.


    Censored in the usual direction. Hit rates at wider targets are partly observable -- the journal records
    tp1_hit, tp2_hit and tp3_hit, so we know how often price reached 1.5x and 2.08x reward. What we cannot
    see is what a trade would have done had the stop also moved, since tracking ends at the first target
    touched. The reachable-versus-required comparison is therefore sound for the targets already published
    and an extrapolation beyond them.'
  validation_id: v-h-reward-to-risk-below-two-cannot-carry-costs
- id: h-stop-after-a-losing-string
  category: trading_discipline
  statement: A string of losses signals that the method has stopped working and trading should halt, rather
    than being the normal behaviour of an unchanged edge.
  derived_from:
  - landry-stop-and-re-evaluate-after-a-losing-string
  - douglas-edge-is-a-probability-not-a-prediction
  measurable_as: Compare the longest observed losing streak against the distribution of longest streaks
    from simulations of an unchanged edge at the same hit rate. If the observed streak sits inside that
    distribution, it is what an intact edge produces and carries no signal.
  invalidated_by: The observed streak falling within the range an unchanged edge produces, in which case
    halting after one would be abandoning a working system for noise.
  testability: existing_data_full
  sample_required: 400
  status: untested
  felix_inputs: []
  notes: 'Adjudicates the sharpest disagreement in the library. Landry (Rules 15-16) says stop and re-evaluate
    after a losing string; Douglas says a losing string is exactly what a probabilistic edge produces
    and abandoning a system over one is the classic error. Both cannot be acted on at once.


    Partly answered already by v-h-losing-runs-cluster, which found the longest observed streak of 14
    sitting at the 99.7th percentile of 5,000 independent simulations -- longer than independence predicts,
    which leans toward Landry. But the same test found only 1 of 8 symbols clustering individually, so
    the streak may be correlated instruments losing together rather than a method failing. This hypothesis
    exists to settle which, because the two readings call for opposite actions: halt trading, or cap correlated
    exposure.'
- id: h-reward-to-risk-sweep-improves-expectancy
  category: risk_management
  statement: Increasing the reward-to-risk ratio produces a robust improvement in expectancy and risk-adjusted
    performance, relative to the frozen baseline.
  derived_from:
  - landry-reward-to-risk-minimum-two-to-one
  measurable_as: Nine-arm sweep across rr1 in {0.807 baseline, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 3.0},
    moving InpTakeProfit1ATR only and holding InpStopLossATR at 1.2 so cost-as-share-of-risk is not confounded
    with the ratio. Fully pre-registered at docs/PREREG_2026-08-29_REWARD_TO_RISK.md in the FelixBot repository.
  invalidated_by: Observed hit rate at each arm staying below that arm's break-even requirement across
    the whole range -- which the existing TP1/TP2/TP3 pattern already suggests is likely -- or net expectancy
    failing to improve with rr, or the best arm passing in-sample but failing walk-forward.
  testability: needs_new_data
  sample_required: 3483
  status: untested
  felix_inputs:
  - InpTakeProfit1ATR
  - InpStopLossATR
  notes: 'Supersedes h-reward-to-risk-below-two-cannot-carry-costs as the operative question. That hypothesis
    is SUPPORTED but establishes only a category-1 fact: reward multiples below 2.0 are arithmetically
    impossible at the measured hit rate and cost. Impossible-below-2.0 is not the same claim as works-at-2.0,
    and 2.0 carries no special status here -- it is arm 6 of nine and competes on identical criteria.


    387 decided trades per arm, 3,483 across the sweep, sized to detect a 0.20 R difference at 80% power.
    A smaller effect could not close the -0.49 R gap the system currently carries, so detecting one would
    change no decision.


    Cannot be answered from the existing journal: tracking stops at the first target touched, so MFE is
    censored at the target for every winner and wider targets cannot be simulated backwards.'
- id: h-retest-events-outperform-breakout-events
  category: support_resistance
  statement: Signals taken on a retest of a broken level produce better expectancy than signals taken
    on the breakout itself.
  derived_from:
  - oz-broken-level-becomes-support-on-retest
  - oz-two-entries-support-or-breakout
  - ho-15-minute-opening-range-scalp
  - ho-5-minute-standard-deviation-scalp
  measurable_as: Group existing journal rows by sr_event and compare win rate and expectancy for Bullish/Bearish
    Retest against Breakout Up/Down, with a chi-square on win/loss and Mann-Whitney U on realised R. Both
    event types are already labelled by the indicator, so no configuration change is needed.
  invalidated_by: Retest signals showing expectancy equal to or below breakout signals, or a difference
    that does not survive the sample size available.
  testability: existing_data_full
  sample_required: 767
  status: untested
  felix_inputs:
  - InpDetectRetests
  - InpRetestProximityATR
  - InpBreakoutRetestMode
  notes: 'Answerable today: 145 retest events against 393 breakouts already recorded. Distinct from h-retest-beats-immediate-breakout,
    which asks whether *requiring* a retest before crediting a breakout improves the system and needs
    a configuration change. This one compares the two event types the indicator already distinguishes,
    and settles the breakout-versus-pullback argument running through Kevin Ho, Tony Oz and Linda Raschke
    on our own data rather than by choosing an author.


    Adjudicates all four sources at once. Kevin Ho''s Pattern 1 enters the break and his Pattern 5 waits
    for the pullback; Tony Oz names the same tension and declines to choose. One comparison on our own
    event labels settles every pairing between them.'
  last_attempt:
    date: '2026-08-21'
    validation_id: v-h-retest-events-outperform-breakout-events
    reason: inconclusive -- sample below the required size
- id: h-structure-based-stop-beats-atr-stop
  category: trade_management
  statement: Placing the stop just beyond the nearest structural level produces better expectancy than
    a fixed ATR multiple from entry.
  derived_from:
  - oz-stop-goes-just-below-support
  measurable_as: Add a structure-based stop mode and compare against the current 1.2 x ATR stop, holding
    the reward multiple and every other input fixed. Report expectancy, mean stop distance, mean cost_r,
    and net expectancy under the REALISTIC scenario.
  invalidated_by: Structure-based stops producing equal or worse net expectancy, or producing stops so
    tight that cost as a share of risk rises and cancels any gain in accuracy.
  testability: needs_new_data
  sample_required: 3483
  status: untested
  felix_inputs:
  - InpStopLossATR
  notes: 'Queued deliberately BEHIND the pre-registered R:R sweep, and the ordering matters. The sweep
    holds the stop at 1.2 x ATR precisely so the reward ratio is not confounded with cost as a share of
    risk. Introducing a variable stop at the same time would change both at once and make neither interpretable.


    It is also the more interesting variable of the two. Cost as a share of risk moves inversely with
    stop distance, and that relationship is the mechanism behind the supported cost result -- so a stop
    rule that systematically widens stops could address the blocker in a way widening targets cannot.
    Needs its own pre-registration once the sweep concludes.'
