# SOURCE KNOWLEDGE -- what Mark Douglas claims.
#
# Most of this book cannot be tested on a trade journal, and the extraction says
# so plainly rather than inventing measurements to make it look rigorous. Two
# concepts do connect to something we can check; the rest are principles.

- id: douglas-five-fundamental-truths
  category: psychology
  claim: >
    A probabilistic mindset rests on five truths: anything can happen; you do
    not need to know what happens next to make money; there is a random
    distribution between wins and losses for any given set of variables that
    define an edge; an edge is nothing more than an indication of a higher
    probability of one thing happening over another; and every moment in the
    market is unique.
  source:
    book: "Trading in the Zone"
    author: "Mark Douglas"
    year: 2001
    chapter: "7 -- The Trader's Edge: Thinking in Probabilities"
    page: "102"
  rationale: >
    Emotional pain in trading comes from how information is interpreted, not
    from the information itself. Expectations aligned with these five truths
    leave nothing for the market to threaten, which removes the emotional risk
    that causes errors.
  conditions:
    - "The truths must be held as beliefs, not merely understood as ideas"
  assumptions:
    - "Most trading errors are psychological rather than analytical"
    - "The trader already has an edge worth executing"
  invalidated_by:
    - "Errors persisting after the beliefs are adopted (Douglas offers no test for this)"
  mechanics:
    - "probabilistic thinking"
    - "expectation management"
  evidence_quality: none
  author_claimed_result: >
    No measurement offered. Presented as argument supported by two decades of
    coaching experience.
  stance: unrelated
  felix_inputs: []
  felix_current_behaviour: >
    An indicator has no mental state. Nothing in FelixScalper is affected by
    this either way.
  notes: >
    Truth 3 is the one that touches our work indirectly: "there is a random
    distribution between wins and losses for any given set of variables that
    define an edge". That is exactly why we compute drawdown distributions and
    run Monte Carlo over the R sequence rather than reading a losing streak as
    a broken system. Douglas argues it as psychology; we already implement it
    as statistics.

- id: douglas-seven-principles-of-consistency
  category: trading_discipline
  claim: >
    Consistency is built from seven sub-beliefs: I objectively identify my
    edges; I predefine the risk of every trade; I completely accept risk or I
    am willing to let go of the trade; I act on my edges without reservation or
    hesitation; I pay myself as the market makes money available; I continually
    monitor my susceptibility for making errors; I understand the absolute
    necessity of these principles and therefore never violate them.
  source:
    book: "Trading in the Zone"
    author: "Mark Douglas"
    year: 2001
    chapter: "11 -- Thinking Like a Trader"
    page: "185"
  rationale: >
    "I am a consistent winner" is too abstract to act on, so it is decomposed
    into seven behaviours that can each be practised deliberately.
  conditions:
    - "All seven held together; Douglas treats them as indivisible"
  assumptions:
    - "Behaviour follows belief rather than the reverse"
  invalidated_by:
    - "Not specified by the author"
  mechanics:
    - "predefined risk"
    - "rule adherence"
    - "error monitoring"
  evidence_quality: none
  author_claimed_result: "None offered."
  stance: agrees
  felix_inputs:
    - InpStopLossATR
    - InpTakeProfit1ATR
  felix_current_behaviour: >
    Principles 1 and 2 are structurally enforced rather than left to
    willpower. Every signal is generated by a fixed scoring rule, and entry,
    stop and all three targets are published at signal time and written to the
    journal before the outcome is known.
  notes: >
    The interesting observation is that a mechanical system converts most of
    these from psychology into architecture. "I predefine the risk of every
    trade" is not a discipline problem when the stop is computed and recorded
    automatically. Principles 3 through 7 remain human and remain untestable.

- id: douglas-four-primary-trading-fears
  category: psychology
  claim: >
    Around 95% of trading errors stem from four fears: being wrong, losing
    money, missing out, and leaving money on the table.
  source:
    book: "Trading in the Zone"
    author: "Mark Douglas"
    year: 2001
    chapter: "2 -- The Lure (and the Dangers) of Trading"
    page: "20"
  rationale: >
    Fear narrows perception. A trader afraid of being wrong will act in a way
    that produces the outcome feared, because no other possibility is visible
    while afraid.
  conditions: []
  assumptions:
    - "The trader is executing discretionary decisions"
  invalidated_by:
    - "Not specified"
  mechanics:
    - "fear of being wrong"
    - "fear of losing money"
    - "fear of missing out"
    - "fear of leaving money on the table"
  evidence_quality: none
  author_claimed_result: >
    The figure of 95% is asserted, not measured, and no method for arriving at
    it is given.
  stance: unrelated
  felix_inputs: []
  felix_current_behaviour: >
    Not applicable to an automated signal generator. It becomes relevant only
    at the point a human decides whether to act on a signal.
  notes: >
    The 95% figure is the kind of precise-sounding number that circulates
    detached from its source. Recorded here as asserted so nobody later cites
    it as a finding.

- id: douglas-edge-is-a-probability-not-a-prediction
  category: strategy_concepts
  claim: >
    An edge is only an indication of a higher probability of one outcome over
    another. Each pattern is a unique occurrence -- patterns may measure
    identically while the traders producing them are entirely different -- so
    outcomes are random relative to one another even when the setup is the same.
  source:
    book: "Trading in the Zone"
    author: "Mark Douglas"
    year: 2001
    chapter: "8 -- Working with Your Beliefs"
    page: "125"
  rationale: >
    The underlying force behind any pattern is the population of traders
    creating it, and that population changes from one occurrence to the next.
  conditions: []
  assumptions:
    - "Market structure is driven by participants rather than by mechanics"
  invalidated_by:
    - "Identical setups producing reliably identical outcomes"
  mechanics:
    - "edge as probability"
    - "independence of outcomes"
  evidence_quality: none
  author_claimed_result: "None offered."
  stance: agrees
  felix_inputs:
    - InpMinScore
  felix_current_behaviour: >
    FelixScalper reports a 0-100 confidence rather than a prediction, and the
    journal records every signal including losers.
  notes: >
    Worth pairing with our own measurement: the factor screen found the 0-100
    score does not discriminate winners from losers in our sample (Spearman
    +0.057, p_raw 0.229, not significant after FDR). Douglas would say a score
    was never supposed to predict an individual outcome. Our data says this
    particular score does not currently separate them over a sample either,
    which is a different and larger problem than the one he is describing.

- id: douglas-edge-erodes-as-participants-change
  category: strategy_concepts
  claim: >
    A set of variables defining an edge may work well for an extended period
    and then lose effectiveness, because the underlying dynamics of interaction
    between participants change as traders enter and leave the market. No fixed
    set of variables can account for this.
  source:
    book: "Trading in the Zone"
    author: "Mark Douglas"
    year: 2001
    chapter: "11 -- Thinking Like a Trader"
    page: "186"
  rationale: >
    Any edge is a snapshot of something fluid, capturing a limited portion of
    the possibilities at the time it was defined.
  conditions:
    - "Detection requires trading in sample sizes rather than trade by trade"
  assumptions:
    - "Market dynamics drift continuously rather than in discrete regimes"
  invalidated_by:
    - "An edge remaining stable over many years and participant turnovers"
  mechanics:
    - "edge decay"
    - "sample-based evaluation"
  evidence_quality: none
  author_claimed_result: "None offered."
  stance: agrees
  felix_inputs: []
  felix_current_behaviour: >
    The research layer already tests for exactly this with expanding
    chronological walk-forward windows, which measure whether performance in a
    training period survives into the period after it.
  notes: >
    Douglas states edge decay as a reason to monitor; our walk-forward
    implementation is the measurement he does not provide. Current result: 2 of
    4 test windows positive, mean out-of-sample expectancy +0.036 R -- unstable,
    which is consistent with his claim but far too small a sample to
    demonstrate decay as opposed to noise.

- id: douglas-judge-an-edge-over-a-sample-of-twenty
  category: strategy_concepts
  claim: >
    Success or failure must be assessed over a sample of at least 20 trades,
    not trade by trade. Twenty is offered as large enough to give the variables
    a fair test while small enough that a decline in effectiveness is caught
    before it costs an inordinate amount.
  source:
    book: "Trading in the Zone"
    author: "Mark Douglas"
    year: 2001
    chapter: "11 -- Thinking Like a Trader"
    page: "186"
  rationale: >
    The typical trader lives or dies emotionally on the most recent trade and
    abandons a working edge after a normal losing run.
  conditions:
    - "Risk known in advance on every trade in the sample"
    - "The full sample is completed before the edge is judged"
  assumptions:
    - "Twenty trades is enough to distinguish a working edge from a failing one"
  invalidated_by:
    - "Twenty-trade samples producing conclusions that reverse on larger samples"
  mechanics:
    - "sample-based evaluation"
    - "predefined risk"
  evidence_quality: none
  author_claimed_result: >
    "I have found that a sample size of at least 20 trades fulfills both of
    these requirements" -- experience, with no calculation shown.
  stance: contradicts
  felix_inputs: []
  felix_current_behaviour: >
    The dashboard's smallest sample banner is 30, and the research layer treats
    anything under 100 as early data. Detecting a 10-percentage-point change in
    win rate at 80% power needs 767 trades; a 5-point change needs 3,106.
  notes: >
    The direction of the advice is right and the number is not. Twenty trades
    at a 53% baseline has a 95% confidence interval on win rate roughly 30
    percentage points wide -- wide enough to contain both a strong edge and a
    losing system simultaneously. This is the single claim in the book that
    our own data can adjudicate, and it is registered as a hypothesis rather
    than argued about.

- id: douglas-consistency-is-a-mental-state-not-analysis
  category: psychology
  claim: >
    Consistent results come from a mindset rather than from better analysis.
    More market knowledge does not produce consistency and can deepen the
    problem by increasing the trader's confidence in prediction.
  source:
    book: "Trading in the Zone"
    author: "Mark Douglas"
    year: 2001
    chapter: "1 -- The Road to Success: Fundamental, Technical, or Mental Analysis"
    page: "4"
  rationale: >
    Analysis produces a probability; only the trader's state determines whether
    it is executed without error over a long series.
  conditions: []
  assumptions:
    - "The trader's analysis is already adequate"
  invalidated_by:
    - "Not specified"
  mechanics:
    - "mental analysis"
  evidence_quality: none
  author_claimed_result: "None offered."
  conflicts_with:
    - ho-scalping-definition
  stance: unrelated
  felix_inputs: []
  felix_current_behaviour: >
    FelixScalper is an analytical system with no discretionary component, so
    the claim neither supports nor threatens it.
  notes: >
    The conflict recorded with Kevin Ho is real but partial. Ho's entire
    contribution is mechanical setups with fixed rules, which is exactly the
    "more analysis" Douglas argues is not the answer. Both can be right for
    different traders, and neither can be settled by our journal -- which is
    why the hypothesis derived from this pair is filed unfalsifiable rather
    than queued.
