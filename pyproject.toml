[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-base-knowledge"
version = "0.1.0"
description = "Research memory: source claims, hypotheses and validated knowledge kept separate"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7.0"]

[tool.setuptools]
packages = ["kb"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
